apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinelai.fullname" . }}-neo4j
  labels:
    {{- include "sentinelai.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "sentinelai.name" . }}
    app.kubernetes.io/component: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
