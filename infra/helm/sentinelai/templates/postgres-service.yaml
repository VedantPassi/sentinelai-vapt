apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinelai.fullname" . }}-postgres
  labels:
    {{- include "sentinelai.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "sentinelai.name" . }}
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
      targetPort: 5432
