apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sentinelai.fullname" . }}-redis-data
  labels:
    {{- include "sentinelai.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.redis.storageClassName }}
  storageClassName: {{ .Values.redis.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.storage }}
