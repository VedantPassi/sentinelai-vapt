apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinelai.fullname" . }}-redis
  labels:
    {{- include "sentinelai.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "sentinelai.name" . }}
    app.kubernetes.io/component: redis
  ports:
    - port: 6379
      targetPort: 6379
