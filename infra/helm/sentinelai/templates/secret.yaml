apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinelai.fullname" . }}-secrets
  labels:
    {{- include "sentinelai.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  REDIS_PASSWORD: {{ required "secrets.redisPassword is required" .Values.secrets.redisPassword | quote }}
  NEO4J_PASSWORD: {{ required "secrets.neo4jPassword is required" .Values.secrets.neo4jPassword | quote }}
  JWT_SECRET_KEY: {{ required "secrets.jwtSecretKey is required" .Values.secrets.jwtSecretKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | default "" | quote }}
  BLOODHOUND_SECRET: {{ .Values.secrets.bloodhoundSecret | default "" | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | default "" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | default "" | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | default "" | quote }}
